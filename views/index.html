<!doctype html>
<html lang="pt-br">
  <head>
      <meta charset="utf-8">
      <meta name="description" content="alphasec">
      <meta name="author" content="alphasec">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Chat IA</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:500&display=swap">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="h1 text-center mb-4">alphasec</h1>
      <div id="chat-box" class="border rounded p-3 mb-3" style="height:300px; overflow-y:auto;"></div>
      <div class="input-group mb-3">
        <input type="text" id="user-input" class="form-control" placeholder="Digite sua mensagem...">
        <div class="input-group-append">
          <button id="send-btn" class="btn btn-primary">Enviar</button>
        </div>
      </div>
      <span class="text-muted small">alphasec © 2024. All rights reserved.</span>
    </div>
    <script>
      async function sendMessage() {
        const input = document.getElementById('user-input');
        const message = input.value.trim();
        if (!message) return;
        appendMessage('Você', message);
        input.value = '';
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        if (response.ok) {
          const data = await response.json();
          appendMessage('Assistente', data.reply);
        } else {
          appendMessage('Assistente', 'Erro ao gerar resposta.');
        }
      }

      function appendMessage(sender, text) {
        const chatBox = document.getElementById('chat-box');
        const p = document.createElement('p');
        p.innerHTML = `<strong>${sender}:</strong> ${text}`;
        chatBox.appendChild(p);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      document.getElementById('send-btn').addEventListener('click', sendMessage);
      document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });
    </script>
  </body>
</html>
